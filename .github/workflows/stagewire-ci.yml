name: StageWire CI

on:
  push:
    branches: [main, v1.4-active-call]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: stagewire-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PORT: 5173
      BASE_PATH: /
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply credential API contract and regenerate clients
        run: |
          node scripts/add-worker-credentials-contract.mjs
          pnpm --dir lib/api-spec codegen
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/api-spec/openapi.yaml lib/api-client-react/src/generated lib/api-zod/src/generated
          if ! git diff --cached --quiet; then
            git commit -m "Add server-backed credential API"
            git push
          fi
      - name: Verify generated API clients
        run: |
          pnpm --dir lib/api-spec codegen
          git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src/generated
      - name: Build shared library types
        run: pnpm run typecheck:libs
      - name: Test API record integrity
        run: pnpm --dir artifacts/api-server test
      - name: Typecheck API server
        run: pnpm --dir artifacts/api-server typecheck
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Typecheck StageWire
        run: pnpm --dir artifacts/stagewire typecheck
      - name: Build StageWire
        run: pnpm --dir artifacts/stagewire build
