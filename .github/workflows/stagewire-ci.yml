name: StageWire CI

on:
  push:
    branches: [main, v1.4-active-call]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PORT: 5173
      BASE_PATH: /
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck StageWire
        run: pnpm --dir artifacts/stagewire typecheck
      - name: Build StageWire
        run: pnpm --dir artifacts/stagewire build
