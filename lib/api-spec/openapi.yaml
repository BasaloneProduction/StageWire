openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: StageWire worker workflow API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: Worker profile operations
  - name: learning
    description: Worker-owned credential operations
  - name: calls
    description: Work call operations
  - name: vault
    description: Worker-owned archive operations
  - name: passport
    description: Career Passport operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [calls]
      summary: Get the worker dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the private worker profile
      responses:
        "200":
          description: Worker profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerProfile"
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Save the private worker profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated worker profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerProfile"
        "400":
          description: Invalid profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /calls:
    get:
      operationId: listCalls
      tags: [calls]
      summary: List upcoming and completed calls
      responses:
        "200":
          description: Calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"
    post:
      operationId: createCall
      tags: [calls]
      summary: Add an upcoming call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallInput"
      responses:
        "201":
          description: Created call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "400":
          description: Invalid call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /calls/{id}:
    get:
      operationId: getCall
      tags: [calls]
      summary: Get one call
      parameters:
        - $ref: "#/components/parameters/CallId"
      responses:
        "200":
          description: Call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Call not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /calls/{id}/finish:
    post:
      operationId: finishCall
      tags: [calls]
      summary: Finish a call and create its permanent receipt
      parameters:
        - $ref: "#/components/parameters/CallId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishCallInput"
      responses:
        "200":
          description: Permanent call receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "400":
          description: Invalid finish details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Call not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Call is already finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /calls/{id}/workday:
    get:
      operationId: getCallWorkday
      tags: [calls]
      summary: Get the active workday data for a call
      parameters:
        - $ref: "#/components/parameters/CallId"
      responses:
        "200":
          description: Checklist, notes, and expenses for the call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workday"

  /calls/{id}/arrive:
    post:
      operationId: arriveAtCall
      tags: [calls]
      summary: Record or correct arrival at a call
      parameters:
        - $ref: "#/components/parameters/CallId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArrivalInput"
      responses:
        "200":
          description: Updated call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "400":
          description: Invalid arrival
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /calls/{id}/start:
    post:
      operationId: startCallWork
      tags: [calls]
      summary: Record or correct the paid work start
      parameters:
        - $ref: "#/components/parameters/CallId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartWorkInput"
      responses:
        "200":
          description: Updated call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "400":
          description: Invalid work start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /calls/{id}/checklist:
    get:
      operationId: getCallChecklist
      tags: [calls]
      summary: Get the checklist for a call
      parameters:
        - $ref: "#/components/parameters/CallId"
      responses:
        "200":
          description: Call checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checklist"

  /calls/{id}/checklist/items:
    post:
      operationId: addChecklistItem
      tags: [calls]
      summary: Add a custom checklist item
      parameters:
        - $ref: "#/components/parameters/CallId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistItemInput"
      responses:
        "201":
          description: Added checklist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItem"

  /calls/{id}/checklist/items/{itemId}:
    patch:
      operationId: updateChecklistItem
      tags: [calls]
      summary: Check or rename a checklist item
      parameters:
        - $ref: "#/components/parameters/CallId"
        - $ref: "#/components/parameters/ChecklistItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistItemUpdateInput"
      responses:
        "200":
          description: Updated checklist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItem"
    delete:
      operationId: deleteChecklistItem
      tags: [calls]
      summary: Remove a custom checklist item
      parameters:
        - $ref: "#/components/parameters/CallId"
        - $ref: "#/components/parameters/ChecklistItemId"
      responses:
        "204":
          description: Checklist item removed

  /calls/{id}/checklist/reset:
    post:
      operationId: resetCallChecklist
      tags: [calls]
      summary: Reset checklist checks for a call
      parameters:
        - $ref: "#/components/parameters/CallId"
      responses:
        "200":
          description: Reset checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checklist"

  /calls/{id}/notes:
    post:
      operationId: addCallNote
      tags: [calls]
      summary: Add a private timestamped note to a call
      parameters:
        - $ref: "#/components/parameters/CallId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Added private note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallNote"

  /calls/{id}/expenses:
    post:
      operationId: addCallExpense
      tags: [calls]
      summary: Add a private expense to a call
      parameters:
        - $ref: "#/components/parameters/CallId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Added private expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallExpense"

  /credentials:
    get:
      operationId: listCredentials
      tags: [learning]
      summary: List the worker credential wallet
      responses:
        "200":
          description: Worker credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credential"
    post:
      operationId: createCredential
      tags: [learning]
      summary: Add a worker credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialInput"
      responses:
        "201":
          description: Created credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          description: Invalid credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /credentials/{credentialId}:
    patch:
      operationId: updateCredential
      tags: [learning]
      summary: Update a worker credential
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialUpdateInput"
      responses:
        "200":
          description: Updated credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          description: Invalid credential update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Credential not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCredential
      tags: [learning]
      summary: Remove a worker credential
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Credential removed
        "404":
          description: Credential not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vault:
    get:
      operationId: getVault
      tags: [vault]
      summary: Get the worker-owned Vault
      responses:
        "200":
          description: Vault sections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"

  /passport:
    get:
      operationId: getPassport
      tags: [passport]
      summary: Get the private Career Passport summary
      responses:
        "200":
          description: Career Passport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPassport"

components:
  parameters:
    CallId:
      name: id
      in: path
      required: true
      description: Call identifier
      schema:
        type: integer
        minimum: 1
    ChecklistItemId:
      name: itemId
      in: path
      required: true
      description: Checklist item identifier
      schema:
        type: integer
        minimum: 1
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Credential:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        issuer:
          type: string
        expires:
          type: ["string", "null"]
          format: date
        status:
          type: string
          enum: [current, planned]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, issuer, expires, status, createdAt, updatedAt]
    CredentialInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        issuer:
          type: string
        expires:
          type: ["string", "null"]
          format: date
        status:
          type: string
          enum: [current, planned]
      required: [name, status]
    CredentialUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        issuer:
          type: string
        expires:
          type: ["string", "null"]
          format: date
        status:
          type: string
          enum: [current, planned]

    WorkerProfile:
      type: object
      properties:
        id:
          type: integer
        displayName:
          type: string
        homeCityState:
          type: string
        phone:
          type: string
        email:
          type: string
        primaryRole:
          type: string
        additionalRoles:
          type: array
          items:
            type: string
        yearsExperience:
          type: integer
          minimum: 0
        skills:
          type: array
          items:
            type: string
        certifications:
          type: array
          items:
            type: string
        bio:
          type: ["string", "null"]
        emergencyContact:
          type: ["string", "null"]
        profilePhotoName:
          type: ["string", "null"]
        privateByDefault:
          type: boolean
        sharePhoto:
          type: boolean
        shareHomeBase:
          type: boolean
        shareSkills:
          type: boolean
        shareCertifications:
          type: boolean
        taxReservePercent:
          type: integer
          minimum: 0
          maximum: 100
      required:
        - id
        - displayName
        - homeCityState
        - phone
        - email
        - primaryRole
        - additionalRoles
        - yearsExperience
        - skills
        - certifications
        - bio
        - emergencyContact
        - profilePhotoName
        - privateByDefault
        - sharePhoto
        - shareHomeBase
        - shareSkills
        - shareCertifications
        - taxReservePercent
    ProfileInput:
      type: object
      properties:
        displayName:
          type: string
        homeCityState:
          type: string
        phone:
          type: string
        email:
          type: string
        primaryRole:
          type: string
        additionalRoles:
          type: array
          items:
            type: string
        yearsExperience:
          type: integer
          minimum: 0
        skills:
          type: array
          items:
            type: string
        certifications:
          type: array
          items:
            type: string
        bio:
          type: ["string", "null"]
        emergencyContact:
          type: ["string", "null"]
        profilePhotoName:
          type: ["string", "null"]
        sharePhoto:
          type: boolean
        shareHomeBase:
          type: boolean
        shareSkills:
          type: boolean
        shareCertifications:
          type: boolean
        taxReservePercent:
          type: integer
          minimum: 0
          maximum: 100
      required:
        - displayName
        - primaryRole
    Call:
      type: object
      properties:
        id:
          type: integer
        venue:
          type: string
        venueAddress:
          type: ["string", "null"]
        showName:
          type: string
        workDate:
          type: string
          format: date
        scheduledStart:
          type: ["string", "null"]
        estimatedEnd:
          type: ["string", "null"]
        role:
          type: string
        department:
          type: ["string", "null"]
        employer:
          type: ["string", "null"]
        crewContactName:
          type: ["string", "null"]
        crewContactPhone:
          type: ["string", "null"]
        parkingInstructions:
          type: ["string", "null"]
        crewEntrance:
          type: ["string", "null"]
        loadingDockInfo:
          type: ["string", "null"]
        dressRequirements:
          type: ["string", "null"]
        ppeRequirements:
          type: ["string", "null"]
        toolRequirements:
          type: ["string", "null"]
        generalNotes:
          type: ["string", "null"]
        payType:
          type: string
          enum: [hourly, day, flat]
        minimumHours:
          type: number
          minimum: 0
        status:
          type: string
          enum: [upcoming, arrived, active, finished]
        arrivalAt:
          type: ["string", "null"]
        actualStart:
          type: ["string", "null"]
        actualEnd:
          type: ["string", "null"]
        breakMinutes:
          type: integer
          minimum: 0
        hourlyRate:
          type: number
          minimum: 0
        expenseAmount:
          type: number
          minimum: 0
        mileage:
          type: number
          minimum: 0
        parkingExpense:
          type: number
          minimum: 0
        tollExpense:
          type: number
          minimum: 0
        expenseDescription:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        receiptAttachmentName:
          type: ["string", "null"]
        workPhotoName:
          type: ["string", "null"]
        overtimeHours:
          type: number
          minimum: 0
        doubleTimeHours:
          type: number
          minimum: 0
        mealPenaltyAmount:
          type: number
          minimum: 0
        completedAt:
          type: ["string", "null"]
        hours:
          type: number
          minimum: 0
        gross:
          type: number
          minimum: 0
      required:
        - id
        - venue
        - venueAddress
        - showName
        - workDate
        - scheduledStart
        - estimatedEnd
        - role
        - department
        - employer
        - crewContactName
        - crewContactPhone
        - parkingInstructions
        - crewEntrance
        - loadingDockInfo
        - dressRequirements
        - ppeRequirements
        - toolRequirements
        - generalNotes
        - payType
        - minimumHours
        - status
        - arrivalAt
        - actualStart
        - actualEnd
        - breakMinutes
        - hourlyRate
        - expenseAmount
        - mileage
        - parkingExpense
        - tollExpense
        - expenseDescription
        - note
        - receiptAttachmentName
        - workPhotoName
        - overtimeHours
        - doubleTimeHours
        - mealPenaltyAmount
        - completedAt
        - hours
        - gross
    CallInput:
      type: object
      properties:
        venue:
          type: string
          minLength: 1
        venueAddress:
          type: ["string", "null"]
        showName:
          type: string
          minLength: 1
        workDate:
          type: string
          format: date
        scheduledStart:
          type: ["string", "null"]
        estimatedEnd:
          type: ["string", "null"]
        role:
          type: string
          minLength: 1
        department:
          type: ["string", "null"]
        employer:
          type: ["string", "null"]
        crewContactName:
          type: ["string", "null"]
        crewContactPhone:
          type: ["string", "null"]
        parkingInstructions:
          type: ["string", "null"]
        crewEntrance:
          type: ["string", "null"]
        loadingDockInfo:
          type: ["string", "null"]
        dressRequirements:
          type: ["string", "null"]
        ppeRequirements:
          type: ["string", "null"]
        toolRequirements:
          type: ["string", "null"]
        generalNotes:
          type: ["string", "null"]
        payType:
          type: string
          enum: [hourly, day, flat]
        minimumHours:
          type: number
          minimum: 0
        hourlyRate:
          type: number
          minimum: 0
        checklist:
          type: array
          items:
            type: string
      required: [venue, showName, workDate, role]
    FinishCallInput:
      type: object
      properties:
        actualStart:
          type: string
          minLength: 1
        actualEnd:
          type: string
          minLength: 1
        breakMinutes:
          type: integer
          minimum: 0
        role:
          type: string
          minLength: 1
        arrivalAt:
          type: ["string", "null"]
        expenseAmount:
          type: number
          minimum: 0
        additionalExpenseAmount:
          type: number
          minimum: 0
        additionalExpenseCategory:
          type: string
        additionalExpenseDescription:
          type: ["string", "null"]
        mileage:
          type: number
          minimum: 0
        parkingExpense:
          type: number
          minimum: 0
        tollExpense:
          type: number
          minimum: 0
        expenseDescription:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        receiptAttachmentName:
          type: ["string", "null"]
        workPhotoName:
          type: ["string", "null"]
      required: [actualStart, actualEnd, role]
    ArrivalInput:
      type: object
      properties:
        arrivalAt:
          type: string
          minLength: 1
      required: [arrivalAt]
    StartWorkInput:
      type: object
      properties:
        actualStart:
          type: string
          minLength: 1
      required: [actualStart]
    ChecklistItem:
      type: object
      properties:
        id:
          type: integer
        callId:
          type: integer
        label:
          type: string
        checked:
          type: boolean
        isCustom:
          type: boolean
        isSuggested:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
      required: [id, callId, label, checked, isCustom, isSuggested, sortOrder, createdAt]
    Checklist:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
      required: [items]
    ChecklistItemInput:
      type: object
      properties:
        label:
          type: string
          minLength: 1
      required: [label]
    ChecklistItemUpdateInput:
      type: object
      properties:
        checked:
          type: boolean
        label:
          type: string
          minLength: 1
      required: []
    CallNote:
      type: object
      properties:
        id:
          type: integer
        callId:
          type: integer
        text:
          type: string
        category:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, callId, text, category, createdAt]
    NoteInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        category:
          type: ["string", "null"]
      required: [text]
    CallExpense:
      type: object
      properties:
        id:
          type: integer
        callId:
          type: integer
        amount:
          type: number
          minimum: 0
        category:
          type: string
        description:
          type: ["string", "null"]
        receiptAttachmentName:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, callId, amount, category, description, receiptAttachmentName, createdAt]
    ExpenseInput:
      type: object
      properties:
        amount:
          type: number
          minimum: 0
        category:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        receiptAttachmentName:
          type: ["string", "null"]
      required: [amount, category]
    Workday:
      type: object
      properties:
        call:
          $ref: "#/components/schemas/Call"
        checklist:
          $ref: "#/components/schemas/Checklist"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/CallNote"
        expenses:
          type: array
          items:
            $ref: "#/components/schemas/CallExpense"
      required: [call, checklist, notes, expenses]
    Attachment:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [document, photo]
        callId:
          type: integer
      required: [name, kind, callId]
    Vault:
      type: object
      properties:
        calls:
          type: array
          items:
            $ref: "#/components/schemas/Call"
        certifications:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        photos:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
      required: [calls, certifications, skills, documents, photos]
    RoleExperience:
      type: object
      properties:
        role:
          type: string
        calls:
          type: integer
        hours:
          type: number
      required: [role, calls, hours]
    CareerPassport:
      type: object
      properties:
        workerName:
          type: string
        primaryRole:
          type: string
        additionalRoles:
          type: array
